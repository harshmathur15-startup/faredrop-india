version: 2
updates:
  # Application dependencies (npm). Weekly PRs, minor/patch grouped to reduce noise.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # Skip routine major-version bumps (breaking risk, not security). Security
    # updates still bypass this ignore rule, so critical majors are still raised.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # Keep GitHub Actions pinned versions current too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
